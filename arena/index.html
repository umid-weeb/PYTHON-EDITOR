<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pyzone Arena</title>
    <meta
      name="description"
      content="Pyzone Arena is a modern competitive coding workspace for solving, testing, and submitting programming problems."
    />
    <script>
      (function() {
        var script = document.createElement('script');
        var isZone = window.location.pathname.startsWith('/zone');
        script.src = isZone ? '/zone/pyodide/pyodide.js' : '/pyodide/pyodide.js';
        script.onerror = function() {
          var cdnScript = document.createElement('script');
          cdnScript.src = 'https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js';
          document.head.appendChild(cdnScript);
        };
        document.head.appendChild(script);
      })();
    </script>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("pyzone-theme");
          var system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", saved || system);
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
  </html>
